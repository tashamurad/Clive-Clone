<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIVE</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
}

/* LEFT */
.left{
    display:flex;
    align-items:center;
    gap:10px;
}

/* MENU */
.menu div{
    width:22px;
    height:3px;
    background:black;
    margin:4px 0;
}

/* LOGO */
.logo{
    font-size:45px;
    font-weight:bold;
    color:#002147;
}

/* BAG */
.bag{
    width:25px;
    height:20px;
    border:2px solid black;
    position:relative;
}
.bag::before{
    content:'';
    width:12px;
    height:8px;
    border:2px solid black;
    border-bottom:none;
    position:absolute;
    top:-8px;
    left:4px;
    border-radius:10px 10px 0 0;
}

/* NAV + SEARCH */
.nav-search{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    padding:10px 25px;
    gap:15px;
}

.nav{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.nav a{
    text-decoration:none;
    color:black;
    font-size:14px;
}

/* SEARCH */
.search{
    display:flex;
    align-items:center;
    gap:10px;
    margin-left:auto;
}

.search input{
    width:140px;
    border:none;
    border-bottom:2px solid black;
    outline:none;
    padding:4px;
}

/* VIDEO SECTION (IMPORTANT PART) */
.video-section{
    width:100%;
}

/* 👇 VERY IMPORTANT: LARGE SCROLLABLE VIDEO */
.video-section video{
    width:100%;
    height:200vh;   /* double screen height = scroll effect */
    object-fit:cover;
}

/* HERO */
.hero{
    height:250px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.hero .big{
    position:absolute;
    font-size:120px;
    color:lightgrey;
    font-weight:bold;
}

.hero .small{
    position:absolute;
    font-size:70px;
    color:#002147;
    font-weight:bold;
}

/* FOOTER */
.footer{
    background:#002147;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
}

/* RESPONSIVE */
@media(max-width:768px){

.logo{
    font-size:30px;
}

.hero .big{
    font-size:60px;
}

.hero .small{
    font-size:35px;
}

.video-section video{
    height:160vh;
}

.search input{
    width:100px;
}

}

@media(max-width:480px){

.nav-search{
    flex-direction:column;
    align-items:flex-start;
}

.search{
    margin-left:0;
}

.hero{
    height:180px;
}

.hero .big{
    font-size:40px;
}

.hero .small{
    font-size:25px;
}

.video-section video{
    height:140vh;
}

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="left">
        <div class="menu">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="logo">CLIVE</div>
    </div>

    <div class="bag"></div>
</div>

<!-- NAV -->
<div class="nav-search">

    <div class="nav">
        <a href="men.html">MEN</a>
        <a href="women.html">WOMEN</a>
        <a href="kids.html">KIDS</a>
        <a href="sales.html">SALES</a>
    </div>

    <div class="search">
        <span>Search</span>
        <input type="text">
    </div>

</div>

<!-- VIDEO (SCROLLABLE) -->
<div class="video-section">
    <video autoplay muted loop playsinline>
        <source src="https://media.istockphoto.com/id/952188602/video/shelf-of-shoes-in-retail-store-at-shopping-mall.mp4?s=mp4-640x640-is&k=20&c=qkyPIpM4b0bV3f1Jd1YHQJAPU7DA-9x6EcsHL_pxw2I=">
    </video>
</div>

<!-- HERO -->
<div class="hero">
    <div class="big">CLIVE</div>
    <div class="small">CLIVE</div>
</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 CLIVE Brands. All Rights Reserved.
</div>

</body>
</html>
